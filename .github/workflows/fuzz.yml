name: Fuzz
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    uses: paulmillr/cryptofuzz/.github/workflows/noble-commit-fuzz.yml@c4c2c6054b3545f7d6bb0f8608371a6a6f3c93fb
    with:
      ref: ${{ github.sha }}
  slow:
    name: Slow large input tests
    uses: paulmillr/jsbt/.github/workflows/test-custom.yml@84f47b72e990ae11999fbe06c3efa449e943de60
    with:
      npm-task: test:slow
  dos:
    name: DoS tests
    uses: paulmillr/jsbt/.github/workflows/test-custom.yml@84f47b72e990ae11999fbe06c3efa449e943de60
    with:
      npm-task: test:dos
  acvp:
    name: ACVP tests
    uses: paulmillr/jsbt/.github/workflows/test-custom.yml@84f47b72e990ae11999fbe06c3efa449e943de60
    with:
      npm-task: test:acvp
  kdf:
    name: KDF tests
    uses: paulmillr/jsbt/.github/workflows/test-custom.yml@84f47b72e990ae11999fbe06c3efa449e943de60
    with:
      npm-task: test:kdf
